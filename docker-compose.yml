# docker-compose.yml

# at the time of running the compose build, the code should be built in js, minified and then the container should be built on it

version: "3.8"
services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_SERVER_PATH=server
      - NEXT_PUBLIC_SERVER_PORT=8080
    depends_on:
      - server
    networks:
      - pockets-network

  server:
    build: ./server
    ports:
      - "8080:8080"
    networks:
      - pockets-network

networks:
  pockets-network:
    driver: bridge
