<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#A10054">
    <title>Offline | Pockets</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff8ec; color: #321a27; font-family: system-ui, sans-serif; }
      main { max-width: 28rem; padding: 2rem; }
      h1 { color: #a10054; }
      button { background: #a10054; color: white; border: 0; border-radius: .5rem; padding: .75rem 1.25rem; font: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>Pockets needs an internet connection to create or join a room. Check your connection and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
