name: Deploy UI to Render

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "packages/shared/**"
      - ".github/workflows/deploy-ui.yml"

  # Allow manual trigger
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
