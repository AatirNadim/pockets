name: Deploy UI to Vercel

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "shared/**"
      - "pnpm-lock.yaml"
      - "frontend/Dockerfile"
      - ".github/workflows/deploy-ui.yml"

  # Allow manual trigger
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: frontend_env
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Trigger Vercel Deploy
        run: |
          curl -X POST "${{ secrets.UI_DEPLOYMENT_HOOK }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            --fail \
            --silent \
            --show-error
      - name: Deployment Triggered
        run: |
          echo "✅ Vercel deployment triggered successfully"
