name: Render Keep-Alive Ping

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI / CLI

concurrency:
  group: render-keepalive
  cancel-in-progress: false

jobs:
  ping:
    name: Ping Health Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Keep-Alive Health Ping
        env:
          HEALTH_URL: "https://pockets-kyb4.onrender.com/health"
          MAX_RETRIES: "3"
          CONNECT_TIMEOUT: "20"
          MAX_TIME: "75"
          BACKOFF_BASE: "5"
        run: |
          chmod +x ./scripts/render-keepalive.sh
          ./scripts/render-keepalive.sh
