name: Deploy Cloudflare Keep-Alive

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/keepalive/**'
      - '.github/workflows/deploy-cloudflare-keepalive.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-keepalive
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Test Worker
        run: node --test cloudflare/keepalive/test/*.test.mjs
      - name: Deploy Worker and cron trigger
        working-directory: cloudflare/keepalive
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.54.0 deploy
